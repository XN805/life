name: Persist v4.8.3 Build
on:
  push:
    branches: [v483-full-rebuild]
    paths:
      - 'rebuild/**'
      - '.github/workflows/build-v483-push.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v483-full-rebuild
      - name: Build
        run: python rebuild/build_v483.py
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Diagnose browser DOM
        run: |
          cat > diagnose-v483.js <<'NODE'
          const {chromium}=require('playwright'),path=require('path'),fs=require('fs');
          (async()=>{const r={checks:[],errors:[],runtime:[]};let b;const mark=(name,data={})=>r.checks.push({name,...data});try{b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1440,height:900}});p.on('pageerror',e=>r.runtime.push(e.stack||e.message));p.on('console',m=>{if(m.type()==='error')r.runtime.push('console:'+m.text())});await p.goto('file://'+path.resolve('dist/ai_moments_v4_8_3_reviewed.html'));mark('source-loaded',{title:await p.title()});mark('before-open',await p.evaluate(()=>({editor:document.querySelectorAll('#momentEditor').length,copy:document.querySelectorAll('#finalCopy').length,parking:document.querySelectorAll('#momentEditorParking').length,step2:document.querySelectorAll('#step2Panel').length,html:document.querySelector('#step2Panel')?.innerHTML.slice(0,500)})));await p.click('#openAiBtn');mark('after-open',await p.evaluate(()=>({editor:document.querySelectorAll('#momentEditor').length,copy:document.querySelectorAll('#finalCopy').length,parking:document.querySelectorAll('#momentEditorParking').length,cards:document.querySelectorAll('[data-moment-card]').length,step4:getComputedStyle(document.querySelector('#step4Panel')).display})));if(await p.locator('#finalCopy').count()){await p.fill('#taskName','618活动推广');await p.fill('[data-rule-name]','预热');await p.fill('#finalCopy','验证文案');await p.fill('[data-slot-prompt]','正面图');await p.click('[data-generate-image]');await p.click('#addSlotBtn');await p.locator('[data-slot-prompt]').nth(1).fill('细节图');await p.locator('[data-generate-image]').nth(1).click();mark('images',{count:await p.locator('.ai-result-v483 img').count()});await p.click('[data-preview-moment]');await p.waitForSelector('#momentPreviewModal.show',{timeout:5000});mark('preview',{images:await p.locator('[data-preview-image]').count(),summary:await p.locator('.quick-preview-summary').count()});await p.locator('[data-preview-image]').nth(1).dragTo(p.locator('[data-preview-image]').nth(0));await p.click('.preview-popover-close');await p.click('#createTaskBtn');mark('create',{modal:await p.locator('#taskConfirmModal').getAttribute('class'),toast:await p.locator('#toast').textContent()});}}catch(e){r.errors.push(e.stack||String(e))}finally{if(b)await b.close();fs.mkdirSync('dist',{recursive:true});fs.writeFileSync('dist/browser-diagnostics.json',JSON.stringify(r,null,2))}})();
          NODE
          NODE_PATH="$PWD/node_modules" node diagnose-v483.js
      - name: Persist output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/ai_moments_v4_8_3_reviewed.html dist/browser-diagnostics.json
          git commit -m "build: persist AI moments v4.8.3 diagnostics" || exit 0
          git push origin HEAD:v483-full-rebuild
